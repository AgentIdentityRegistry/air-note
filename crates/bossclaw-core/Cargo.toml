[package]
name = "bossclaw-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Local-first, signed, encrypted memory engine for BossClaw."
repository = "https://github.com/AgentIdentityRegistry/air-note"

[dependencies]
bossclaw-canon = { path = "../bossclaw-canon" }
model2vec-rs = { version = "0.2", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ed25519-dalek = "2.1"
serde_jcs = "0.1.0"
sha2 = "0.10"
multibase = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
log = "0.4"
hnsw_rs = "0.3.4"
# Safe, I/O-safe syscall bindings — used by the ingest careful-open + walk so the
# crate keeps `#![forbid(unsafe_code)]` (no hand-rolled libc/unsafe). `fs` enables
# openat/openat2/statat/readdir; `process` is not needed in M5a.
rustix = { version = "0.38", features = ["fs"] }

# M6c Task 10: the live filesystem watcher's backend. unix-only — the watcher
# module (`watch.rs`) and everything that touches `notify` are `#[cfg(unix)]`-gated,
# so a non-unix target never even resolves this dependency. PINNED EXACT (`=8.2.0`,
# the current max-stable on crates.io as of 2026-06; 9.0.0 is RC-only) so a passive
# `cargo update` cannot pull a new minor that changes the watcher backend behavior
# under us. The `notify`-internal `unsafe` (FSEvents/inotify FFI) lives in the
# `notify` crate, NOT in bossclaw-core, so this crate keeps `#![forbid(unsafe_code)]`.
# Default features are kept DELIBERATELY MINIMAL: `notify`'s default is exactly
# `macos_fsevent` (the macOS FSEvents backend we need); we add NO `serde`,
# `macos_kqueue`, or `serialization-compat-6`. On Linux the inotify backend rides in
# automatically via a platform-conditional dependency. NOTE FOR THE REVIEWER:
# `cargo audit` should run pre-merge (this is the first new dependency in several
# milestones).
[target.'cfg(unix)'.dependencies]
notify = "=8.2.0"

[features]
fastembed = ["dep:fastembed"]
# The `ollama` feature adds `OllamaReasoner` (loopback HTTP POST to a local
# Ollama server). The default build is pure (no network dep). Enable this
# feature in production binaries that ship the real LLM backend.
ollama = ["dep:ureq"]
# M5b: sandboxed markitdown subprocess parser. Enables rustix `process`
# (kill_process_group for the timeout group-kill). Default build stays pure.
markitdown = ["rustix/process", "dep:tempfile"]
# Test-only jail probes (un-jailed control, egress watcher). CI enables this;
# release binaries enable only `markitdown` and must NOT ship these hooks.
sandbox-test-hooks = ["markitdown"]

[dependencies.fastembed]
version = "5.16"
optional = true

[dependencies.ureq]
version = "2"
optional = true
default-features = false
features = ["json", "tls"]

[dependencies.tempfile]
version = "3"
optional = true

[dev-dependencies]
tempfile = "3"
