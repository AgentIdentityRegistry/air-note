[package]
name = "bossclaw-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Local-first, signed, encrypted memory engine for BossClaw."
repository = "https://github.com/AgentIdentityRegistry/air-note"

[dependencies]
model2vec-rs = { version = "0.2", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ed25519-dalek = "2.1"
serde_jcs = "0.1.0"
sha2 = "0.10"
multibase = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
log = "0.4"
hnsw_rs = "0.3.4"

[features]
fastembed = ["dep:fastembed"]
# The `ollama` feature adds `OllamaReasoner` (loopback HTTP POST to a local
# Ollama server). The default build is pure (no network dep). Enable this
# feature in production binaries that ship the real LLM backend.
ollama = ["dep:ureq"]

[dependencies.fastembed]
version = "5.16"
optional = true

[dependencies.ureq]
version = "2"
optional = true
default-features = false
features = ["json", "tls"]

[dev-dependencies]
tempfile = "3"
