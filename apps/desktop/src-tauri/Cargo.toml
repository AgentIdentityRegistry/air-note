[package]
name = "air_agent_desktop"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "AIR Agent desktop agent"
repository = "https://github.com/AgentIdentityRegistry/air-note"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
air-rs = { path = "../../../crates/air-rs" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand_core = { version = "0.6", features = ["std"] }
multibase = "0.9"
unsigned-varint = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
# Rung-5 export saves through a `NamedTempFile` in the target folder: O_EXCL under an unguessable
# name (no symlink redirect) and deleted on drop (no readable fragment survives a failed write).
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }

# Memory/actuator engine (SP1): bossclaw-core is Unix-only until M7 — it pulls bundled-SQLCipher
# (needs a system OpenSSL on Windows) + rustix, so the desktop excludes the engine on Windows via
# `#[cfg(unix)]`. `zeroize` is used only by the engine keystore, so it rides in the same section.
[target.'cfg(unix)'.dependencies]
bossclaw-core = { path = "../../../crates/bossclaw-core", features = ["ollama"] }
# Rung-5 SP-V1: the `.airmem` format types. The app MINTS the identity binding (only it holds the
# AIR identity key), so it must build a `Binding`/`BindingPayload` and canonicalize the payload with
# the SAME code the daemon validates against and the verifier reads — never a re-typed shape.
bossclaw-bundle = { path = "../../../crates/bossclaw-bundle" }
# M1a Task 5: the daemon wire protocol (frame codec + Request/Response + Hello handshake + wire
# mirrors). Unix-only alongside the engine — the daemon transport is a Unix-socket protocol, and the
# `SocketTransport`/`EngineClient` live under `engine/` which is already `#[cfg(unix)]`-gated.
bossclawd-proto = { path = "../../../crates/bossclawd-proto" }
# Single source of truth for the daemon socket/data-dir path resolution, shared with the daemon
# (`bossclawd`) so the app's `resolve_socket_path` binds the SAME path the daemon serves.
bossclawd-paths = { path = "../../../crates/bossclawd-paths" }
zeroize = "1"

# Single-instance guard (CF2): exactly one desktop process, so the in-process POLICY_LOCK is the
# whole-machine lock and two instances can't both reserve the same budget slot. Desktop-only plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "2.3", features = ["linux-secret-service", "linux-keyutils"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring = "2.3"

[dev-dependencies]
# `tempfile` is a REGULAR dependency now (the export save path uses it), and a regular dependency is
# already available to tests — restating it here would be redundant, not additive.
tauri = { version = "2", features = ["test"] }

# M1a Task 5: the real daemon (with its `test-helpers` feature) so the transport/client tests can
# spin a live `bossclawd` accept loop on a temp Unix socket — hermetic (in-memory vault + mock
# providers, NEVER the OS keychain). Unix-only: `bossclawd` is a Unix-socket daemon that pulls
# bossclaw-core (bundled-SQLCipher + rustix), so it must not enter the Windows dev-dep tree.
[target.'cfg(unix)'.dev-dependencies]
bossclawd = { path = "../../../crates/bossclawd", features = ["test-helpers"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
