name: Build

on:
  push:
    branches: [main, "v1/**"]
  pull_request:
    branches: [main]

# Cargo network resilience: GH Actions intermittently hits transient crates.io fetch
# failures (HTTP/2 framing on Windows; dropped downloads on Linux/macOS) that redden CI
# with no code change. Retry registry downloads and disable HTTP/2 multiplexing. Set at
# top level so all jobs (build, bossclaw-core, bossclaw-core-jail) inherit it.
env:
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev

      - name: Install npm dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck --workspace @air-agent/desktop

      - name: Create frontend dist dir (required for tauri::generate_context!)
        run: mkdir -p apps/desktop/dist

      - name: Rust check
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build Tauri app
        run: npm run build --workspace @air-agent/desktop

  # bossclaw-core engine — its own job (the desktop crate does NOT depend on it,
  # so the job above never compiled or tested it). Default features = pure build
  # (no subprocess, no network). Unix-only this milestone: M5a/M5b ingest is
  # Unix-only, and SQLCipher (bundled-sqlcipher) needs a system OpenSSL on Windows.
  # Windows engine support + its crypto-backend choice lands at M7 (desktop wiring).
  bossclaw-core:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('Cargo.lock') }}
      - name: Test bossclaw-core (default features)
        run: cargo test -p bossclaw-core
      - name: Clippy bossclaw-core (default features)
        run: cargo clippy -p bossclaw-core --all-targets -- -D warnings
      - name: Engine network-free guard (embedder runs un-sandboxed only if its graph has no HTTP client)
        run: |
          if cargo tree -p bossclaw-core -e normal --prefix none | grep -qE '^(hf-hub|ureq|reqwest)( |$)'; then
            echo "FORBIDDEN: a network crate is in the default bossclaw-core graph"; exit 1
          fi
          echo "engine graph is network-free"

  # M5b sandboxed-parser jail proofs. Builds the pinned markitdown venv (pip-audit
  # + 0.1.6 drift guard run inside build-venv.sh), then runs the gated jail tests.
  # macOS validates the Seatbelt path; Ubuntu validates the bwrap/PID-ns path.
  bossclaw-core-jail:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-jail-${{ hashFiles('Cargo.lock') }}
      - name: Install bubblewrap (Linux jail tool)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # The committed per-platform lockfiles (requirements-{macos-arm64,linux-x86_64}.lock)
      # are the source of truth; build-venv.sh installs from them with --require-hashes and
      # pip-audits them. No CI regeneration — this leg now audits + installs the COMMITTED
      # Linux lock, so a drifted/incomplete lock fails here instead of being silently rebuilt.
      - name: Build the markitdown venv (pip-audit + version drift guard inside)
        run: PYBIN=python crates/bossclaw-core/scripts/build-venv.sh "${{ runner.temp }}/m5b-venv"
      - name: Clippy bossclaw-core (sandbox-test-hooks feature)
        run: cargo clippy -p bossclaw-core --features sandbox-test-hooks --all-targets -- -D warnings
      - name: Markitdown version-pin drift guard (Rust const vs requirements.in)
        run: |
          rust_pin=$(grep -oE 'MARKITDOWN_VERSION: &str = "[^"]+"' crates/bossclaw-core/src/sandbox.rs | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          lock_pin=$(grep -oE 'markitdown\[[^]]*\]==[0-9.]+' crates/bossclaw-core/python/requirements.in | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "rust=$rust_pin lock=$lock_pin"
          [ "$rust_pin" = "$lock_pin" ] || { echo "markitdown pin drift"; exit 1; }
      # Hermetic sandbox unit tests (no venv/jail) — these are NOT #[ignore], so the
      # gated step below (`-- --ignored`) skips them; run them explicitly so the jail
      # arg-construction logic (jail_extra_ro_binds) is exercised on every PR.
      - name: Sandbox hermetic unit tests
        run: "cargo test -p bossclaw-core --features sandbox-test-hooks --lib sandbox::"
      - name: Gated jail proofs
        run: cargo test -p bossclaw-core --features sandbox-test-hooks -- --ignored
        env:
          BOSSCLAW_MARKITDOWN_VENV: ${{ runner.temp }}/m5b-venv
